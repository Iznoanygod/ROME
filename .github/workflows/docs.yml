name: Documentation

on:
  push:
    branches:
      - main
      # TEMPORARY, remove when this branch merges. `workflow_dispatch` cannot
      # cover this: GitHub only offers the "Run workflow" button for a workflow
      # that already exists on the default branch, so a docs branch cannot be
      # previewed on Pages until it has merged -- unless it triggers on its own
      # push, as here.
      - claude/rome-mkdocs-docs-ee3oos
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-docs-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-docs-
            ${{ runner.os }}-pip-

      # Docs dependencies only. mkdocstrings reads the source statically via
      # griffe, so the reference builds without Dragon, torch or a GPU -- which
      # is what keeps this job a minute rather than twenty.
      - name: Install docs dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r docs/requirements.txt

      - name: Build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  # Deploys on a push to main, or on demand from any branch via
  # Actions -> Documentation -> Run workflow. The manual path is how you preview
  # a docs branch on the live Pages URL before it is merged; note that Pages
  # serves ONE site, so a preview deploy replaces whatever main last published
  # until main is pushed again.
  deploy:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
